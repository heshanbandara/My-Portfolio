
name: Update GitHub Activity

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub Activity
        env:
          GH_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: |
          gh api graphql -f query='
          {
            user(login: "heshanbandara") {
              contributionsCollection {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalPullRequestReviewContributions
              }
            }
          }' > response.json

          jq -e '
            .data.user.contributionsCollection |
            select(
              .totalCommitContributions != null
              and .totalIssueContributions != null
              and .totalPullRequestContributions != null
              and .totalPullRequestReviewContributions != null
            ) |
            {
              commits: .totalCommitContributions,
              issues: .totalIssueContributions,
              pullRequests: .totalPullRequestContributions,
              reviews: .totalPullRequestReviewContributions,
              updatedAt: (now | todateiso8601)
            }
          ' response.json > activity.json

          rm response.json

      - name: Commit Activity Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.json
          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub activity data"
            git push
          fi
